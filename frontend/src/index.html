<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ysu-theme') || 'dark';
        if (t !== 'dark' && t !== 'light') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <meta charset="utf-8">
  <title>اتحاد الطلبة اليمنيين في ماليزيا</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="الموقع الرسمي لاتحاد الطلبة اليمنيين في ماليزيا">
  <link rel="icon" type="image/x-icon" href="/logo/ysu_logo_cropped.ico">
  <link rel="preload" as="image" href="/logo/ysu_logo.webp">

  <!-- App loader: painted by the browser before Angular's JS bundle loads, so
       there's never a blank/white frame. Angular removes it via AppLoaderService
       once the app (or the home page's hero images) is ready. -->
  <style>
    #ysu-app-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #141e30;
      opacity: 1;
      transition: opacity 500ms ease-in-out;
      padding: 24px;
      box-sizing: border-box;
    }
    #ysu-app-loader.is-hidden { opacity: 0; pointer-events: none; }
    html[data-theme="light"] #ysu-app-loader { background: #f8f9fc; }

    #ysu-app-loader .pb-emblem {
      position: relative;
      width: min(240px, 60vw);
      aspect-ratio: 1;
      animation: pb-in 600ms ease-out both;
    }
    #ysu-app-loader .pb-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      animation: pb-spin 28s linear infinite;
    }
    html[data-theme="light"] #ysu-app-loader .pb-ring {
      border-color: #dde4ef;
    }
    #ysu-app-loader .pb-ring--dashed {
      inset: 10%;
      border: 1px dashed rgba(201, 168, 76, 0.55);
      animation: pb-spin-reverse 38s linear infinite;
    }
    #ysu-app-loader .pb-dot {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c9a84c;
      box-shadow: 0 0 14px rgba(201, 168, 76, 0.9);
    }
    #ysu-app-loader .pb-glow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(122, 157, 212, 0.3), transparent 70%);
      filter: blur(24px);
      animation: pb-pulse 4s ease-in-out infinite;
    }
    #ysu-app-loader .pb-core {
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 60px rgba(122, 157, 212, 0.45);
      overflow: hidden;
    }
    #ysu-app-loader .pb-core img {
      width: 82%;
      height: 82%;
      object-fit: contain;
    }
    #ysu-app-loader .pb-text {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.02em;
      text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      color: rgba(255, 255, 255, 0.72);
      animation: pb-pulse-text 2s ease-in-out infinite;
    }
    html[data-theme="light"] #ysu-app-loader .pb-text { color: #5a6a82; }

    @media (max-width: 480px) {
      #ysu-app-loader { gap: 20px; }
      #ysu-app-loader .pb-text { font-size: 0.9rem; }
    }

    @keyframes pb-spin { to { transform: rotate(360deg); } }
    @keyframes pb-spin-reverse { to { transform: rotate(-360deg); } }
    @keyframes pb-pulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.05); } }
    @keyframes pb-pulse-text { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes pb-in { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }

    @media (prefers-reduced-motion: reduce) {
      #ysu-app-loader .pb-emblem,
      #ysu-app-loader .pb-ring,
      #ysu-app-loader .pb-ring--dashed,
      #ysu-app-loader .pb-glow,
      #ysu-app-loader .pb-text { animation: none; }
    }
  </style>
</head>
<body>
  <app-root></app-root>
  <div id="ysu-app-loader">
    <div class="pb-emblem">
      <div class="pb-glow"></div>
      <div class="pb-ring"><span class="pb-dot"></span></div>
      <div class="pb-ring pb-ring--dashed"></div>
      <div class="pb-core">
        <img src="/logo/ysu_logo.webp" alt="شعار اتحاد الطلبة اليمنيين في ماليزيا" />
      </div>
    </div>
    <p class="pb-text">جاري تحضير الموقع...</p>
  </div>
</body>
</html>
