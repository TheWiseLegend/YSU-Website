<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ysu-theme') || 'dark';
        if (t !== 'dark' && t !== 'light') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <meta charset="utf-8">
  <title>اتحاد الطلبة اليمنيين في ماليزيا</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="الموقع الرسمي لاتحاد الطلبة اليمنيين في ماليزيا">
  <link rel="icon" type="image/x-icon" href="/logo/ysu_logo_cropped.ico">
  <link rel="preload" as="image" href="/logo/ysu_logo.webp">
</head>
<body>
  <app-root></app-root>
</body>
</html>
