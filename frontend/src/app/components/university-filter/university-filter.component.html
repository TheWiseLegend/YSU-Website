<div class="filter-section">

  <!-- ── Header ────────────────────────────────────── -->
  <div class="filter-header">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>البحث المتقدم</span>
  </div>

  <!-- ── Top row ──────────────────────────────────────── -->
  <div class="filter-row">

    <!-- University type -->
    <div class="filter-group">
      <span class="filter-label">نوع الجامعة</span>
      <div class="checkbox-row">
        <div class="checkbox-pill" *ngFor="let type of typeOptions">
          <input
            type="checkbox"
            [id]="type.id"
            [(ngModel)]="type.checked"
            [name]="type.id"
            (change)="onCheckboxChange($event, 'type', type.value)">
          <label [for]="type.id">{{ type.value }}</label>
        </div>
      </div>
    </div>

    <div class="filter-divider"></div>

    <!-- City -->
    <div class="filter-group">
      <span class="filter-label">المدينة</span>
      <div class="select-container">
        <select class="custom-select" [(ngModel)]="filter.city" name="city" (change)="onCityChange($event)">
          <option value="">كل المدن</option>
          <option value="كوالالمبور">كوالالمبور</option>
          <option value="جوهور باهرو">جوهور باهرو</option>
          <option value="سايبرجايا">سايبرجايا</option>
          <option value="سيردانج">سيردانغ</option>
          <option value="بوتراجايا">بوتراجايا</option>
          <option value="ملاكا">ملاكا</option>
          <option value="ألور ستار">ألور ستار</option>
          <option value="كنغار">كنغار</option>
          <option value="باتو باهات">باتو باهات</option>
          <option value="جورج تاون">جورج تاون</option>
          <option value="كوتا دامانسارا">كوتا دامانسارا</option>
          <option value="غومباك">غومباك</option>
          <option value="بندر ساوجانا بوترا">بندر ساوجانا بوترا</option>
          <option value="سوبانج جايا">سوبانغ جايا</option>
          <option value="سيبانج">سيبانغ</option>
        </select>
      </div>
    </div>

    <div class="filter-divider"></div>

    <!-- Tuition fee range -->
    <div class="filter-group">
      <span class="filter-label">الرسوم السنوية (RM)</span>
      <div class="range-inputs">
        <div class="input-field">
          <input
            type="number"
            placeholder="الأدنى"
            [(ngModel)]="filter.minFee"
            name="minFee"
            (change)="onFeeChange($event, 'minFee')">
        </div>
        <span class="range-separator">—</span>
        <div class="input-field">
          <input
            type="number"
            placeholder="الأقصى"
            [(ngModel)]="filter.maxFee"
            name="maxFee"
            (change)="onFeeChange($event, 'maxFee')">
        </div>
      </div>
    </div>

    <div class="filter-divider"></div>

    <!-- Language -->
    <div class="filter-group">
      <span class="filter-label">لغة الدراسة</span>
      <div class="checkbox-row">
        <div class="checkbox-pill" *ngFor="let lang of languageOptions">
          <input
            type="checkbox"
            [id]="lang.id"
            [(ngModel)]="lang.checked"
            [name]="lang.id"
            (change)="onCheckboxChange($event, 'language', lang.value)">
          <label [for]="lang.id">{{ lang.value }}</label>
        </div>
      </div>
    </div>

    <div class="filter-divider"></div>

    <!-- Union branch -->
    <div class="filter-group">
      <span class="filter-label">الاتحاد</span>
      <div class="checkbox-row">
        <div class="checkbox-pill">
          <input
            type="checkbox"
            id="has-union-branch"
            [(ngModel)]="filter.hasUnionBranch"
            name="hasUnionBranch"
            (change)="onCheckboxChange($event, 'branch', 'true')">
          <label for="has-union-branch">يوجد فرع للاتحاد</label>
        </div>
      </div>
    </div>

    <div class="filter-divider"></div>

    <!-- Courses toggle -->
    <div class="filter-group">
      <span class="filter-label">التخصصات</span>
      <button
        type="button"
        class="courses-toggle-btn"
        [class.active]="coursesExpanded"
        (click)="toggleCoursesView()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>التخصصات</span>
        <span class="badge" *ngIf="getTotalCheckedCoursesCount() > 0">{{ getTotalCheckedCoursesCount() }}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" [class.open]="coursesExpanded">
          <path d="M19 9l-7 7-7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Reset — pushed to the end -->
    <div class="filter-group filter-group--reset">
      <span class="filter-label">&nbsp;</span>
      <button type="button" class="reset-filter-btn" (click)="resetFilters()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 3v5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        إعادة تعيين
      </button>
    </div>

  </div>

  <!-- ── Courses panel ──────────────────────────────── -->
  <div class="courses-panel" [class.open]="coursesExpanded">
    <div class="courses-panel__inner">
      <div class="course-category" *ngFor="let category of courseCategories; trackBy: trackByCategory">

        <div class="category-header" (click)="toggleCategoryExpansion(category.id)">
          <span class="category-title">
            {{ category.title }}
            <span class="badge" style="margin-right:6px" *ngIf="getCategoryCheckedCount(category.id) > 0">{{ getCategoryCheckedCount(category.id) }}</span>
          </span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               class="expand-icon" [class.expanded]="category.expanded">
            <path d="M19 9l-7 7-7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <div class="category-courses" [class.expanded]="category.expanded">
          <div class="checkbox-group">
            <div class="custom-checkbox" *ngFor="let course of category.courses">
              <input
                type="checkbox"
                [id]="course.id"
                [(ngModel)]="course.checked"
                [name]="course.id"
                (change)="onCheckboxChange($event, 'course', course.value)">
              <label [for]="course.id">{{ course.value }}</label>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>
