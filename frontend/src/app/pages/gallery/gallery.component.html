<!-- ═══════════════════════════════════════════════════════════
     PAGE HEADER
════════════════════════════════════════════════════════════ -->
<app-page-header titleFirst="معرض" titleSecond="الصور"></app-page-header>

<!-- ═══════════════════════════════════════════════════════════
     ALBUMS SECTION
════════════════════════════════════════════════════════════ -->
<section class="gallery-section">
  <div class="container">

    <!-- Section label -->
    <div class="section-label">
      <span class="section-label__line"></span>
      <span class="section-label__text">Gallery</span>
      <span class="section-label__line"></span>
    </div>
    <h2 class="section-title title-gradient">ألبومات الصور</h2>

    <!-- Loading -->
    <div class="state-block" *ngIf="isLoading">
      <div class="spinner"></div>
      <p>جاري تحميل الألبومات...</p>
    </div>

    <!-- Empty -->
    <div class="state-block" *ngIf="!isLoading && albums.length === 0">
      <div class="state-block__icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="8.5" cy="8.5" r="1.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M21 15l-5-5L5 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p>لا توجد ألبومات متاحة في الوقت الحالي</p>
    </div>

    <!-- Albums grid -->
    <div class="albums-grid" *ngIf="!isLoading && albums.length > 0">
      <article class="album-card" *ngFor="let album of albums" (click)="openLightbox(album, 0)">

        <div class="album-card__cover">
          <img [src]="album.mainImage" [alt]="album.title" loading="lazy">
          <div class="album-card__overlay">
            <div class="album-card__overlay-inner">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
                <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <span>عرض الألبوم</span>
            </div>
          </div>
          <!-- Image count badge -->
          <div class="album-card__count">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
              <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
              <path d="M21 15l-5-5L5 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            {{ album.images.length }}
          </div>
        </div>

        <div class="album-card__body">
          <h3 class="album-card__title">{{ album.title }}</h3>
          <p class="album-card__desc" *ngIf="album.description">{{ album.description }}</p>
          <span class="album-card__date">{{ formatDate(album.createdAt) }}</span>
        </div>

      </article>
    </div>

  </div>
</section>


<!-- ═══════════════════════════════════════════════════════════
     LIGHTBOX
════════════════════════════════════════════════════════════ -->
<div class="lightbox" *ngIf="lightboxAlbum" (click)="closeLightbox()">

  <!-- Close -->
  <button class="lightbox__close" (click)="closeLightbox()" aria-label="إغلاق">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- Image -->
  <div class="lightbox__stage" (click)="$event.stopPropagation()">
    <img
      [src]="lightboxAlbum.images[lightboxIndex].url"
      [alt]="lightboxAlbum.title"
      class="lightbox__img">
  </div>

  <!-- Prev / Next -->
  <button class="lightbox__nav lightbox__nav--prev"
          (click)="$event.stopPropagation(); prevImage()"
          aria-label="السابق"
          *ngIf="lightboxAlbum.images.length > 1">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <button class="lightbox__nav lightbox__nav--next"
          (click)="$event.stopPropagation(); nextImage()"
          aria-label="التالي"
          *ngIf="lightboxAlbum.images.length > 1">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- Caption + counter -->
  <div class="lightbox__caption" (click)="$event.stopPropagation()">
    <span class="lightbox__caption-title">{{ lightboxAlbum.title }}</span>
    <span class="lightbox__counter">{{ lightboxIndex + 1 }} / {{ lightboxAlbum.images.length }}</span>
  </div>

  <!-- Thumbnail strip -->
  <div class="lightbox__thumbs" (click)="$event.stopPropagation()" *ngIf="lightboxAlbum.images.length > 1">
    <button
      *ngFor="let img of lightboxAlbum.images; let i = index"
      class="lightbox__thumb"
      [class.active]="i === lightboxIndex"
      (click)="lightboxIndex = i">
      <img [src]="img.url" [alt]="'صورة ' + (i + 1)" loading="lazy">
    </button>
  </div>

</div>
