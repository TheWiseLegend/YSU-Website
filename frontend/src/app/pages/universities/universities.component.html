<!-- ═══════════════════════════════════════════════════════════
     PAGE HEADER
════════════════════════════════════════════════════════════ -->
<app-page-header titleFirst="الجامعات" titleSecond="الماليزية"></app-page-header>

<!-- ═══════════════════════════════════════════════════════════
     FILTER BAR
════════════════════════════════════════════════════════════ -->
<section class="filter-section">
  <div class="container">
    <app-university-filter
      [initialFilter]="initialFilter"
      (filtersChanged)="onFiltersChanged($event)"></app-university-filter>
  </div>
</section>

<!-- ═══════════════════════════════════════════════════════════
     RESULTS
════════════════════════════════════════════════════════════ -->
<section class="results-section">
  <div class="container">

    <!-- Results count -->
    <div class="results-meta" *ngIf="filteredUniversities.length > 0">
      <span class="results-meta__count">{{ filteredUniversities.length }} جامعة</span>
      <span class="results-meta__label">تطابق معايير البحث</span>
    </div>

    <!-- Grid -->
    <div class="university-grid" *ngIf="filteredUniversities.length > 0">
      <app-university-card
        *ngFor="let uni of filteredUniversities"
        [university]="uni"
        (cardClick)="navigateToUniversity($event)">
      </app-university-card>
    </div>

    <!-- No results -->
    <div class="state-block" *ngIf="filteredUniversities.length === 0">
      <div class="state-block__icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="1.8"/>
          <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <h3>لا توجد نتائج</h3>
      <p>لم نجد جامعات تطابق معايير البحث. جرّب تعديل الفلاتر.</p>
    </div>

  </div>
</section>
